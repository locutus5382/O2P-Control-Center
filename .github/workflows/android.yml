name: Android debug build
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'design/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify tracked Android sources
        run: test -f app/src/main/java/com/odin2portal/control/monitor/TelemetryMonitor.kt
      - name: Unit tests and assemble debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: O2P-Control-Center-debug
          path: app/build/outputs/apk/debug/app-debug.apk
