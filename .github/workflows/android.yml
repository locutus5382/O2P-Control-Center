name: Android debug build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Materialize source from initial alpha archive
        run: |
          unzip -q O2P_Control_Center_Alpha_Source.zip
          test -f O2P_Control_Center/app/build.gradle.kts
          cp app/src/main/java/com/odin2portal/control/ui/Appearance.kt O2P_Control_Center/app/src/main/java/com/odin2portal/control/ui/
          cp app/src/main/java/com/odin2portal/control/ui/MainActivity.kt O2P_Control_Center/app/src/main/java/com/odin2portal/control/ui/
      - name: Unit tests and assemble debug APK
        working-directory: O2P_Control_Center
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: O2P-Control-Center-debug
          path: O2P_Control_Center/app/build/outputs/apk/debug/app-debug.apk
